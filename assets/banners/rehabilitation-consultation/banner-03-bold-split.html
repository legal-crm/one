<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>배너 3 — 모바일 최적화 (볼드)</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .banner {
    width: 1200px;
    height: 600px;
    background: #0F2440;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  }

  /* 배경 */
  .bg-glow-1 {
    position: absolute;
    bottom: -100px; left: 20%;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
  }
  .bg-glow-2 {
    position: absolute;
    top: -80px; right: 10%;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(13, 148, 136, 0.08) 0%, transparent 70%);
  }

  .content-left {
    position: relative;
    z-index: 2;
    padding: 0 0 0 80px;
    flex: 1;
  }

  .headline {
    font-size: 76px;
    font-weight: 900;
    line-height: 1.15;
    color: #ffffff;
    letter-spacing: -0.045em;
    margin-bottom: 24px;
  }
  .highlight {
    display: inline-block;
    background: linear-gradient(135deg, #3B82F6, #0D9488);
    padding: 4px 20px;
    border-radius: 12px;
    color: #ffffff;
  }

  .subtext {
    font-size: 24px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 40px;
    letter-spacing: -0.02em;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #ffffff;
    color: #0F2440;
    font-size: 26px;
    font-weight: 800;
    padding: 22px 50px;
    border-radius: 16px;
    border: none;
    letter-spacing: -0.02em;
    white-space: nowrap;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
  }
  .cta-arrow {
    width: 36px;
    height: 36px;
    background: #1E3A5F;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
  }

  /* 우측 — 큰 키워드 강조 */
  .content-right {
    position: relative;
    z-index: 2;
    padding-right: 80px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
  }

  .keyword-chip {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 18px 28px;
  }
  .chip-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .chip-icon-blue { background: rgba(59, 130, 246, 0.2); }
  .chip-icon-teal { background: rgba(13, 148, 136, 0.2); }
  .chip-icon-green { background: rgba(16, 185, 129, 0.2); }

  .chip-text {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .chip-badge {
    font-size: 15px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .badge-blue { background: rgba(59,130,246,0.2); color: #93c5fd; }
  .badge-teal { background: rgba(13,148,136,0.2); color: #5eead4; }
  .badge-green { background: rgba(16,185,129,0.2); color: #6ee7b7; }
</style>
</head>
<body style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div class="banner">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="content-left">
      <h1 class="headline">
        개인회생<br><span class="highlight">무료 상담</span>
      </h1>
      <p class="subtext">전문 변호사가 직접 진단합니다</p>
      <button class="cta-btn">
        지금 상담 시작
        <span class="cta-arrow">→</span>
      </button>
    </div>

    <div class="content-right">
      <div class="keyword-chip">
        <span class="chip-icon chip-icon-blue">📋</span>
        <span class="chip-text">회생 가능 여부 진단</span>
        <span class="chip-badge badge-blue">무료</span>
      </div>
      <div class="keyword-chip">
        <span class="chip-icon chip-icon-teal">💰</span>
        <span class="chip-text">예상 변제금 안내</span>
        <span class="chip-badge badge-teal">맞춤</span>
      </div>
      <div class="keyword-chip">
        <span class="chip-icon chip-icon-green">🔒</span>
        <span class="chip-text">상담 비밀 보장</span>
        <span class="chip-badge badge-green">보장</span>
      </div>
    </div>
  </div>
</body>
</html>
