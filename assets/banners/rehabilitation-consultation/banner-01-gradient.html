<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>배너 1 — 모바일 최적화</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .banner {
    width: 1200px;
    height: 600px;
    background: linear-gradient(135deg, #0F2440 0%, #1E3A5F 50%, #0D9488 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    text-align: center;
  }

  /* 배경 장식 */
  .bg-circle-1 {
    position: absolute;
    top: -100px;
    right: -60px;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, transparent 70%);
  }
  .bg-circle-2 {
    position: absolute;
    bottom: -120px;
    left: -40px;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(13, 148, 136, 0.15) 0%, transparent 70%);
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #5EEAD4;
    font-size: 20px;
    font-weight: 700;
    padding: 10px 28px;
    border-radius: 100px;
    margin-bottom: 28px;
    letter-spacing: -0.02em;
  }
  .badge-dot {
    width: 8px;
    height: 8px;
    background: #10B981;
    border-radius: 50%;
  }

  .headline {
    font-size: 72px;
    font-weight: 900;
    line-height: 1.2;
    color: #ffffff;
    letter-spacing: -0.04em;
    margin-bottom: 20px;
  }
  .headline em {
    font-style: normal;
    color: #5EEAD4;
  }

  .subtext {
    font-size: 24px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.65);
    margin-bottom: 0;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body style="background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div class="banner">
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>
    <div class="content">
      <div class="badge">
        <span class="badge-dot"></span>
        2026 빚탈출 프로젝트!
      </div>
      <h1 class="headline">
        개인회생,<br>혼자 고민하지 <em>마세요</em>
      </h1>
      <p class="subtext">전문 변호사 무료 진단 · 비밀 보장</p>
    </div>
  </div>
</body>
</html>
