<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><style>
@font-face{font-family:'Pretendard';src:url('PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:block;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#E5E7EB;}
body{font-family:'Pretendard',system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;}
.t-navy{--bg:#F8FAFC;--fg:#0F172A;--sub:#475569;--acc:#1E3A5F;--pt:#0D9488;--card:#FFFFFF;--line:#E2E8F0;--hl:rgba(13,148,136,.20);--chipbg:#E2E8F0;--chipfg:#1E3A5F;--deco:rgba(30,58,95,.05);}
.t-navy.is-cover{--bg:linear-gradient(160deg,#1E3A5F 0%,#152B47 100%);--fg:#FFFFFF;--sub:#CBD5E1;--acc:#5EEAD4;--pt:#5EEAD4;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--hl:rgba(94,234,212,.30);--chipbg:rgba(255,255,255,.12);--chipfg:#E2E8F0;--deco:rgba(255,255,255,.06);}
.t-teal{--bg:#F0FDFA;--fg:#0F172A;--sub:#334155;--acc:#0F766E;--pt:#1E3A5F;--card:#FFFFFF;--line:#CCFBF1;--hl:rgba(15,118,110,.18);--chipbg:#CCFBF1;--chipfg:#115E59;--deco:rgba(15,118,110,.06);}
.t-teal.is-cover{--bg:linear-gradient(160deg,#0F766E 0%,#115E59 100%);--fg:#FFFFFF;--sub:#CCFBF1;--acc:#FDE68A;--pt:#FDE68A;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--hl:rgba(253,230,138,.32);--chipbg:rgba(255,255,255,.14);--chipfg:#F0FDFA;--deco:rgba(255,255,255,.07);}
.t-white{--bg:#FFFFFF;--fg:#0F172A;--sub:#475569;--acc:#1E3A5F;--pt:#0D9488;--card:#F8FAFC;--line:#E2E8F0;--hl:rgba(13,148,136,.20);--chipbg:#F1F5F9;--chipfg:#1E3A5F;--deco:rgba(30,58,95,.04);}
.t-white.is-cover{--bg:#FFFFFF;--fg:#0F172A;--sub:#475569;--acc:#1E3A5F;--pt:#1E3A5F;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--hl:rgba(13,148,136,.22);--chipbg:#1E3A5F;--chipfg:#FFFFFF;--deco:rgba(30,58,95,.05);}
.t-dark{--bg:#111827;--fg:#F1F5F9;--sub:#CBD5E1;--acc:#FBBF24;--pt:#5EEAD4;--card:#1F2937;--line:#334155;--hl:rgba(251,191,36,.25);--chipbg:#1F2937;--chipfg:#FDE68A;--deco:rgba(255,255,255,.04);}
.t-dark.is-cover{--bg:linear-gradient(160deg,#0B1220 0%,#111827 100%);--fg:#F8FAFC;--sub:#CBD5E1;--acc:#FBBF24;--pt:#FBBF24;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--hl:rgba(251,191,36,.28);--chipbg:rgba(251,191,36,.14);--chipfg:#FDE68A;--deco:rgba(255,255,255,.05);}
.t-cream{--bg:#FBF8F2;--fg:#1F2937;--sub:#57534E;--acc:#1E3A5F;--pt:#9A3412;--card:#FFFFFF;--line:#E7E5E4;--hl:rgba(217,119,6,.22);--chipbg:#F5EBDD;--chipfg:#9A3412;--deco:rgba(154,52,18,.05);}
.t-cream.is-cover{--bg:#F6F1E7;--fg:#1F2937;--sub:#57534E;--acc:#9A3412;--pt:#9A3412;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--hl:rgba(217,119,6,.25);--chipbg:#1F2937;--chipfg:#FEF3C7;--deco:rgba(154,52,18,.06);}
.t-sky{--bg:#F8FAFC;--fg:#0F172A;--sub:#475569;--acc:#1D4ED8;--pt:#0D9488;--card:#FFFFFF;--line:#DBEAFE;--hl:rgba(29,78,216,.14);--chipbg:#DBEAFE;--chipfg:#1E40AF;--deco:rgba(29,78,216,.05);}
.t-sky.is-cover{--bg:linear-gradient(170deg,#DBEAFE 0%,#EFF6FF 100%);--fg:#0F172A;--sub:#334155;--acc:#1D4ED8;--pt:#1D4ED8;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--hl:rgba(29,78,216,.16);--chipbg:#1D4ED8;--chipfg:#FFFFFF;--deco:rgba(29,78,216,.07);}
.t-coral{--bg:#FFFFFF;--fg:#111827;--sub:#4B5563;--acc:#BE123C;--pt:#1E3A5F;--card:#FFF7F8;--line:#FFE4E6;--hl:rgba(225,29,72,.14);--chipbg:#FFE4E6;--chipfg:#9F1239;--deco:rgba(190,18,60,.04);}
.t-coral.is-cover{--bg:#FFF1F2;--fg:#111827;--sub:#4B5563;--acc:#BE123C;--pt:#BE123C;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--hl:rgba(225,29,72,.16);--chipbg:#BE123C;--chipfg:#FFFFFF;--deco:rgba(190,18,60,.06);}
.t-memo{--bg:#FFFDF2;--fg:#1F2937;--sub:#44403C;--acc:#1E3A5F;--pt:#0F766E;--card:#FFFFFF;--line:#FDE68A;--hl:rgba(250,204,21,.45);--chipbg:#FEF3C7;--chipfg:#92400E;--deco:rgba(31,41,55,.04);}
.t-memo.is-cover{--bg:#FEF9C3;--fg:#1F2937;--sub:#44403C;--acc:#1E3A5F;--pt:#1E3A5F;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--hl:rgba(13,148,136,.22);--chipbg:#1F2937;--chipfg:#FEF9C3;--deco:rgba(31,41,55,.06);}

.slide{--s:1;width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding:72px 88px 64px;letter-spacing:-0.03em;}
.slide > *{position:relative;z-index:2;}
.slide .deco{position:absolute;inset:0;z-index:0;pointer-events:none;}
.ico{display:block;flex:none;}
em.acc{font-style:normal;color:var(--acc);}
mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 4px;border-radius:4px;}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;flex:none;}
.logo{font-size:34px;font-weight:600;letter-spacing:-0.04em;color:var(--fg);display:flex;align-items:center;gap:10px;}
.logo b{font-weight:900;}
.logo .dot{width:14px;height:14px;border-radius:50%;background:var(--pt);display:inline-block;}
.is-cover .logo .dot{background:var(--acc);}
.cat{font-size:24px;font-weight:700;padding:10px 20px;border-radius:14px;background:var(--chipbg);color:var(--chipfg);white-space:nowrap;}
.bot{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none;font-size:24px;font-weight:600;color:var(--sub);}
.bot .pg{font-variant-numeric:tabular-nums;font-weight:700;}
.bot .swipe{display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:700;}
.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:28px 0 24px;overflow:hidden;}
.note{margin-top:calc(var(--s) * 28px);font-size:calc(var(--s) * 24px);line-height:1.5;color:var(--sub);font-weight:500;}
/* 본문 공통 제목 */
.h-bar{width:56px;height:8px;border-radius:8px;background:var(--pt);margin-bottom:calc(var(--s) * 28px);}
.h{font-size:calc(var(--s) * 62px);font-weight:800;line-height:1.28;letter-spacing:-0.04em;margin-bottom:calc(var(--s) * 44px);}
.kicker{font-size:calc(var(--s) * 28px);font-weight:800;color:var(--pt);margin-bottom:calc(var(--s) * 16px);letter-spacing:-0.02em;}
.body p{font-size:calc(var(--s) * 38px);line-height:1.62;color:var(--sub);font-weight:500;}
.body p + p{margin-top:calc(var(--s) * 26px);}
.body p b, .item-d b{color:var(--fg);font-weight:700;}

/* ── COVER ───────────────────────── */
.cv-chip{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;font-size:calc(var(--s) * 28px);font-weight:800;padding:12px 22px;border-radius:14px;background:var(--chipbg);color:var(--chipfg);margin-bottom:calc(var(--s) * 40px);}
.cv-title{font-size:calc(var(--s) * 104px);font-weight:850;line-height:1.2;letter-spacing:-0.05em;}
.cv-sub{margin-top:calc(var(--s) * 40px);font-size:calc(var(--s) * 38px);line-height:1.55;color:var(--sub);font-weight:500;}
.cv-big{font-size:calc(var(--s) * 250px);font-weight:900;line-height:1;letter-spacing:-0.06em;color:var(--acc);margin-bottom:calc(var(--s) * 24px);}
.cv-big small{font-size:calc(var(--s) * 96px);font-weight:800;margin-left:8px;letter-spacing:-0.04em;}
.cv-q{position:absolute;right:40px;top:120px;font-size:720px;font-weight:900;line-height:1;color:var(--deco);letter-spacing:-0.08em;z-index:1;}
.cv-icon{width:calc(var(--s) * 184px);height:calc(var(--s) * 184px);border-radius:36px;background:var(--chipbg);color:var(--chipfg);display:flex;align-items:center;justify-content:center;margin-bottom:calc(var(--s) * 48px);}
.cv-icon .ico{width:calc(var(--s) * 96px);height:calc(var(--s) * 96px);}
.cover-headline .content, .cover-number .content, .cover-question .content, .cover-icon .content{justify-content:flex-end;padding-bottom:64px;}
.cover-split{padding:0;}
.cover-split .split-top{background:var(--bg);color:var(--fg);padding:72px 88px 72px;height:880px;display:flex;flex-direction:column;}
.cover-split .split-bot{flex:1;background:#FFFFFF;color:#0F172A;padding:56px 88px 64px;display:flex;flex-direction:column;justify-content:space-between;}
.cover-split .split-bot .cv-sub{margin-top:0;color:#334155;}
.cover-split .split-bot .bot{color:#475569;}
.cover-split .split-bot .bot .swipe{color:#0F172A;}
.cover-list{margin-top:calc(var(--s) * 44px);display:flex;flex-direction:column;gap:calc(var(--s) * 18px);}
.cover-list div{display:flex;align-items:center;gap:18px;font-size:calc(var(--s) * 34px);font-weight:700;color:var(--fg);opacity:.92;}
.cover-list .ico{color:var(--acc);}

/* ── LIST / STEPS / CHECK ────────── */
.items{display:flex;flex-direction:column;}
.item{display:flex;gap:calc(var(--s) * 30px);align-items:flex-start;padding:calc(var(--s) * 28px) 0;border-top:2px solid var(--line);}
.item:first-child{border-top:none;padding-top:0;}
.num{flex:none;width:calc(var(--s) * 68px);height:calc(var(--s) * 68px);border-radius:50%;background:var(--acc);color:var(--bg);font-size:calc(var(--s) * 32px);font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
.t-dark .num{color:#111827;}
.item-ic{flex:none;width:calc(var(--s) * 68px);height:calc(var(--s) * 68px);border-radius:20px;background:var(--chipbg);color:var(--pt);display:flex;align-items:center;justify-content:center;}
.item-ic .ico{width:calc(var(--s) * 38px);height:calc(var(--s) * 38px);}
.item-t{font-size:calc(var(--s) * 40px);font-weight:800;line-height:1.35;}
.item-d{margin-top:calc(var(--s) * 10px);font-size:calc(var(--s) * 31px);line-height:1.55;color:var(--sub);font-weight:500;}
.check .item{align-items:center;}
.check .item-t{font-weight:700;font-size:calc(var(--s) * 38px);}
.chk{flex:none;color:var(--pt);}
.chk .ico{width:calc(var(--s) * 54px);height:calc(var(--s) * 54px);}
.steps{position:relative;display:flex;flex-direction:column;gap:calc(var(--s) * 34px);}
.step{display:flex;gap:calc(var(--s) * 30px);position:relative;}
.step:not(:last-child)::after{content:'';position:absolute;left:calc(var(--s) * 33px);top:calc(var(--s) * 76px);bottom:calc(var(--s) * -30px);width:3px;background:var(--line);}
.step .num{background:var(--bg);color:var(--acc);border:4px solid var(--acc);}
.step:last-child .num{background:var(--acc);color:var(--bg);}
.t-dark .step:last-child .num{color:#111827;}

/* ── OX ──────────────────────────── */
.ox{display:flex;flex-direction:column;gap:calc(var(--s) * 36px);}
.ox-row{display:flex;gap:calc(var(--s) * 30px);align-items:flex-start;}
.ox-b{flex:none;width:calc(var(--s) * 92px);height:calc(var(--s) * 92px);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s) * 54px);font-weight:900;color:#fff;}
.ox-b.o{background:#0F766E;} .ox-b.x{background:#BE123C;}
.ox-q{font-size:calc(var(--s) * 40px);font-weight:800;line-height:1.35;}
.ox-d{margin-top:calc(var(--s) * 12px);font-size:calc(var(--s) * 31px);line-height:1.55;color:var(--sub);font-weight:500;}
.ox-single .ox-b{width:calc(var(--s) * 150px);height:calc(var(--s) * 150px);font-size:calc(var(--s) * 92px);border-radius:36px;margin-bottom:calc(var(--s) * 36px);}
.ox-single .ox-q{font-size:calc(var(--s) * 54px);}
.ox-single .ox-d{font-size:calc(var(--s) * 36px);margin-top:calc(var(--s) * 24px);}

/* ── COMPARE ─────────────────────── */
.cmp{border-radius:28px;overflow:hidden;border:2px solid var(--line);background:var(--card);}
.cmp-r{display:grid;border-top:2px solid var(--line);}
.cmp-r:first-child{border-top:none;}
.cmp-c{padding:calc(var(--s) * 24px) calc(var(--s) * 22px);font-size:calc(var(--s) * 29px);line-height:1.45;font-weight:600;}
.cmp-c + .cmp-c{border-left:2px solid var(--line);}
.cmp-h .cmp-c{font-size:calc(var(--s) * 32px);font-weight:800;color:#fff;text-align:center;}
.cmp-h .cmp-c.a{background:var(--acc);} .cmp-h .cmp-c.b{background:var(--pt);} .cmp-h .cmp-c.l{background:transparent;}
.t-dark .cmp-h .cmp-c{color:#111827;}
.cmp-c.l{font-weight:800;color:var(--sub);font-size:calc(var(--s) * 27px);}

/* ── Q&A ─────────────────────────── */
.qa-q{display:flex;gap:calc(var(--s) * 24px);align-items:flex-start;margin-bottom:calc(var(--s) * 44px);}
.qa-mark{flex:none;font-size:calc(var(--s) * 84px);font-weight:900;line-height:1;color:var(--acc);letter-spacing:-0.06em;}
.qa-qt{font-size:calc(var(--s) * 54px);font-weight:800;line-height:1.32;padding-top:calc(var(--s) * 8px);}
.qa-a{border-radius:28px;background:var(--card);border:2px solid var(--line);padding:calc(var(--s) * 44px) calc(var(--s) * 44px);display:flex;gap:calc(var(--s) * 24px);}
.qa-a .qa-mark{color:var(--pt);font-size:calc(var(--s) * 64px);}
.qa-a .body p{font-size:calc(var(--s) * 34px);}

/* ── CHAT ────────────────────────── */
.chat{border-radius:36px;background:var(--card);border:2px solid var(--line);overflow:hidden;}
.chat-top{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--s) * 24px) calc(var(--s) * 36px);border-bottom:2px solid var(--line);font-size:calc(var(--s) * 26px);font-weight:700;color:var(--sub);}
.chat-top .tag{font-size:calc(var(--s) * 22px);padding:6px 14px;border-radius:12px;background:var(--chipbg);color:var(--chipfg);}
.chat-body{padding:calc(var(--s) * 36px);display:flex;flex-direction:column;gap:calc(var(--s) * 22px);}
.msg{max-width:82%;display:flex;flex-direction:column;gap:6px;}
.msg .who{font-size:calc(var(--s) * 22px);font-weight:700;color:var(--sub);}
.msg .bub{font-size:calc(var(--s) * 31px);line-height:1.5;padding:calc(var(--s) * 22px) calc(var(--s) * 28px);border-radius:28px;font-weight:500;}
.msg.l{align-self:flex-start;} .msg.l .bub{background:var(--bg);border:2px solid var(--line);border-top-left-radius:8px;}
.msg.r{align-self:flex-end;align-items:flex-end;} .msg.r .bub{background:var(--acc);color:#fff;border-top-right-radius:8px;}
.t-dark .msg.r .bub{color:#111827;}

/* ── STAT ────────────────────────── */
.stat-big{font-size:calc(var(--s) * 210px);font-weight:900;line-height:1;letter-spacing:-0.06em;color:var(--acc);}
.stat-big small{font-size:calc(var(--s) * 80px);font-weight:800;margin-left:6px;letter-spacing:-0.03em;}
.stat .h{margin-top:calc(var(--s) * 36px);margin-bottom:calc(var(--s) * 28px);font-size:calc(var(--s) * 56px);}

/* ── TIP / WARN / QUOTE ─────────── */
.box{border-radius:28px;background:var(--card);border:2px solid var(--line);padding:calc(var(--s) * 52px) calc(var(--s) * 48px);position:relative;}
.box-lab{display:inline-flex;align-items:center;gap:12px;font-size:calc(var(--s) * 28px);font-weight:800;color:var(--pt);margin-bottom:calc(var(--s) * 24px);}
.box-lab .ico{width:calc(var(--s) * 40px);height:calc(var(--s) * 40px);}
.box .h{font-size:calc(var(--s) * 52px);margin-bottom:calc(var(--s) * 26px);}
.box.warn{border-color:#FDA4AF;background:#FFF1F2;color:#111827;}
.box.warn .box-lab{color:#BE123C;}
.box.warn .body p, .box.warn .item-t{color:#1F2937;}
.box.warn .item{border-top-color:#FECDD3;}
.warn-list .item-t{font-size:calc(var(--s) * 34px);font-weight:700;}
.warn-list .dotb{flex:none;width:14px;height:14px;border-radius:50%;background:#BE123C;margin-top:calc(var(--s) * 20px);}
.quote-mark{font-size:calc(var(--s) * 220px);line-height:.7;font-weight:900;color:var(--acc);opacity:.9;height:calc(var(--s) * 110px);}
.quote-t{font-size:calc(var(--s) * 50px);font-weight:700;line-height:1.5;letter-spacing:-0.035em;}
.quote-by{margin-top:calc(var(--s) * 36px);font-size:calc(var(--s) * 30px);font-weight:700;color:var(--sub);}
.sample{display:inline-block;margin-top:calc(var(--s) * 24px);font-size:calc(var(--s) * 22px);font-weight:700;color:var(--sub);padding:6px 14px;border-radius:12px;border:2px solid var(--line);}

/* ── GLOSSARY ───────────────────── */
.gl .item-t{color:var(--acc);}

/* ── CTA ─────────────────────────── */
.cta .content{justify-content:center;}
.cta-logo{font-size:calc(var(--s) * 52px);font-weight:600;letter-spacing:-0.04em;margin-bottom:calc(var(--s) * 44px);display:flex;align-items:center;gap:14px;}
.cta-logo b{font-weight:900;}
.cta-logo .dot{width:20px;height:20px;border-radius:50%;background:var(--acc);}
.cta-title{font-size:calc(var(--s) * 84px);font-weight:850;line-height:1.24;letter-spacing:-0.05em;margin-bottom:calc(var(--s) * 52px);}
.cta-pts{display:flex;flex-direction:column;gap:calc(var(--s) * 24px);margin-bottom:calc(var(--s) * 56px);}
.cta-pt{display:flex;align-items:center;gap:calc(var(--s) * 22px);font-size:calc(var(--s) * 34px);font-weight:600;line-height:1.4;}
.cta-pt .ico{color:var(--acc);width:calc(var(--s) * 44px);height:calc(var(--s) * 44px);}
.cta-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:16px;white-space:nowrap;font-size:calc(var(--s) * 36px);font-weight:800;padding:calc(var(--s) * 28px) calc(var(--s) * 44px);border-radius:20px;background:var(--acc);color:#0F172A;}
.t-white.is-cover .cta-btn, .t-sky.is-cover .cta-btn, .t-coral.is-cover .cta-btn, .t-cream.is-cover .cta-btn, .t-memo.is-cover .cta-btn{color:#FFFFFF;}
.cta-disc{margin-top:calc(var(--s) * 48px);font-size:calc(var(--s) * 22px);line-height:1.55;color:var(--sub);font-weight:500;}

/* ── 장식 ───────────────────────── */
.dz-circles::before{content:'';position:absolute;width:760px;height:760px;border-radius:50%;right:-300px;top:-260px;background:var(--deco);}
.dz-circles::after{content:'';position:absolute;width:420px;height:420px;border-radius:50%;left:-160px;bottom:220px;background:var(--deco);}
.dz-grid{background-image:radial-gradient(var(--deco) 3px,transparent 3px);background-size:44px 44px;}
.dz-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:18px;background:var(--acc);}
.dz-ring::before{content:'';position:absolute;width:640px;height:640px;border-radius:50%;right:-220px;bottom:-200px;border:90px solid var(--deco);}
.dz-corner::before{content:'';position:absolute;right:0;top:0;width:360px;height:360px;background:var(--deco);border-bottom-left-radius:360px;}
</style></head><body><div id="root"></div><div style="font-family:Pretendard;font-weight:900;position:absolute;left:-9999px">가나다 my김변 0123</div></body></html>
